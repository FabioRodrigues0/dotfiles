[language-server.tinymist]
command = "tinymist"

[language-server.tinymist.config]
exportPdf = "onType"
outputPath = "$root/target/$dir/$name"
preview.background.enabled = true
preview.background.args = ["--data-plane-host=127.0.0.1:23625", "--invert-colors=never", "--open"]

[[language]]
name = "typst"
language-servers = ["tinymist"]
auto-format = true

# ---------- Java (jdtls) ----------
[language-server.jdtls]
command = "jdtls"
timeout = 120

[language-server.jdtls.config.settings.java.format]
enabled = true

[language-server.jdtls.config.settings.java.format.settings]
url = "~/.config/helix/java-format.xml"
profile = "Project"

[[language]]
name = "java"
scope = "source.java"
injection-regex = "java"
file-types = ["java"]
roots = ["pom.xml", "build.gradle", "build.gradle.kts", ".git"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["jdtls"]
auto-format = true

# ---------- Kotlin (JetBrains Kotlin LSP) ----------
# Server oficial da JetBrains (bundle da extensão "Kotlin by JetBrains" do Cursor),
# melhor que o kotlin-language-server (fwcd) default. Instalado em
# ~/.local/share/kotlin-lsp/current, lançado pelo wrapper ~/.local/bin/kotlin-lsp.
[language-server.kotlin-lsp]
command = "kotlin-lsp"
args = ["--stdio"]

[[language]]
name = "kotlin"
language-servers = ["kotlin-lsp"]
auto-format = true

# ---------- Python (ty + ruff) ----------
# ty (Astral) para type-checking/navegação; ruff como LSP para lint e formatação.
[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
auto-format = true

# ---------- SQL (sql-language-server) ----------
[language-server.sql-language-server]
command = "sql-language-server"
args = ["up", "--method", "stdio"]

[[language]]
name = "sql"
language-servers = ["sql-language-server"]

# php, javascript e html usam os defaults do Helix (intelephense,
# typescript-language-server, vscode-html-language-server) — basta o binário no PATH.
