onboarding = false

[ui]
status_indicators = "symbols"
sidebar_width = 16
sidebar_min_width = 12
sidebar_max_width = 20

[ui.sound]
enabled = false

[theme]
name = "tokyo-night"
auto_switch = false

[experimental]
allow_nested = true

# Atalhos diretos sem prefix: alt+... no Linux, cmd+... no Mac.
# Prefix nao pode ser desligado; ctrl+f12 para nunca ser usado (prefix+? mostra tudo).
[keys]
prefix = "ctrl+f12"
detach = ["alt+shift+q", "cmd+shift+q"]
new_tab = ["alt+t", "cmd+t"]
close_pane = ["alt+w", "cmd+w"]
close_tab = ["alt+shift+w", "cmd+shift+w"]
next_tab = ["alt+n", "cmd+shift+]", "cmd+}"]
previous_tab = ["alt+p", "cmd+shift+[", "cmd+{"]
switch_tab = ["alt+1..9", "cmd+1..9"]

focus_pane_left = ["alt+h", "cmd+alt+left"]
focus_pane_down = ["alt+j", "cmd+alt+down"]
focus_pane_up = ["alt+k", "cmd+alt+up"]
focus_pane_right = ["alt+l", "cmd+alt+right"]

split_vertical = ["alt+v", "cmd+d"]
split_horizontal = ["alt+minus", "cmd+shift+d"]
zoom = ["alt+z", "cmd+shift+enter"]
resize_mode = ["alt+r", "cmd+r"]

goto = ["alt+g", "cmd+g"]
toggle_sidebar = ["alt+b", "cmd+b"]

# Janela flutuante (popup) para abrir sessões existentes
[[keys.command]]
key = ["alt+s", "cmd+s"]
type = "popup"
command = "fish -c sessoes"
width = "90%"
height = "85%"

# Janela flutuante (popup) para abrir sessão num caminho à escolha
[[keys.command]]
key = ["alt+o", "cmd+o", "alt+a", "cmd+a"]
type = "popup"
command = "fish -c abrir-escolher"
width = "90%"
height = "85%"
